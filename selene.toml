# selene.toml - Lua linter config for Roblox/Luau (selene v0.32+)
# https://github.com/Kampfkarren/selene

std = "roblox"

# Disable checks that are noisy in Roblox code
disable = [
  "global_usage",      # Roblox globals are expected
  "unused_variable",   # Often intentional in event handlers
  "shadowing",         # Common in Roblox callbacks
  "empty_if",          # Placeholder patterns
  "unscoped_variables" # Luau type annotations handle this
]

# Only error on actual problems
error = [
  "incorrect_standard_library_use",
  "invalid_loop_variable",
  "mismatched_arg_count",
  "multiple_statements",
  "shadowing",
  "unbalanced_assignments",
  "unreachable_code",
  "unused_variable"
]