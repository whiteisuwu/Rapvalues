# Lua/Roblox CI Pipeline
# For Rapvalues and similar Lua projects

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================
  # LINT: selene (Lua linter)
  # ============================================================
  lint:
    name: Lint (selene)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install selene
        run: |
          # Get latest selene release asset URL
          SELENE_URL=$(curl -s https://api.github.com/repos/Kampfkarren/selene/releases/latest | grep "browser_download_url.*selene_linux.tar.gz" | cut -d '"' -f 4)
          curl -L -o selene.tar.gz "$SELENE_URL"
          tar -xzf selene.tar.gz
          chmod +x selene
          sudo mv selene /usr/local/bin/

      - name: Run selene
        run: |
          selene . --config selene.toml 2>/dev/null || selene .

  # ============================================================
  # TEST: Luau/luatest (if test files exist)
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for test files
        id: testfiles
        run: |
          if find . -name "*test*.lua" -o -name "*spec*.lua" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests (placeholder)
        if: steps.testfiles.outputs.exists == 'true'
        run: |
          echo "Add your Lua test runner here (luatest, busted, etc.)"
          # Example: luatest .

  # ============================================================
  # SECURITY: Gitleaks (secrets) + Trivy (if Dockerfile)
  # ============================================================
  security:
    name: Security Scans
    runs-on: ubuntu-latest  # TODO: change to [self-hosted, monitoring] when runner exists
    needs: lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Secrets: Gitleaks ---
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Container scan (if Dockerfile exists) ---
      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [ -f Dockerfile ] || [ -f dockerfile ] || [ -f Containerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Trivy
        if: steps.dockerfile.outputs.exists == 'true'
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Trivy image scan
        if: steps.dockerfile.outputs.exists == 'true'
        run: |
          trivy image --format sarif --output trivy-image.sarif --severity HIGH,CRITICAL --ignore-unfixed '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-${{ github.sha }}' || true

      - name: Upload Trivy SARIF
        if: always() && steps.dockerfile.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ============================================================
  # RELEASE: Create GitHub Release on tag push
  # ============================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, security]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.lua
            *.json